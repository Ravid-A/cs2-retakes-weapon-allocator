name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore plugin
        run: dotnet restore RetakesAllocator.csproj

      - name: Build plugin
        run: dotnet build RetakesAllocator.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/RetakesAllocator.Tests/RetakesAllocator.Tests.csproj -c Release
